{% macro topic_icon(name, size=40) %}
<svg class="topic-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'wallet' %}
  <path d="M8 16a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v4h4a2 2 0 0 1 2 2v12a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V16z"/>
  <circle cx="34" cy="26" r="2" fill="currentColor" stroke="none"/>
  {% elif name == 'cart' %}
  <path d="M6 8h4l4 22h20l4-14H14"/>
  <circle cx="18" cy="38" r="2.5"/>
  <circle cx="32" cy="38" r="2.5"/>
  {% elif name == 'house' %}
  <path d="M8 22 24 8l16 14"/>
  <path d="M12 20v18h24V20"/>
  <path d="M20 38v-10h8v10"/>
  {% elif name == 'briefcase' %}
  <rect x="6" y="16" width="36" height="22" rx="3"/>
  <path d="M17 16v-4a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4"/>
  <path d="M6 26h36"/>
  {% elif name == 'compass' %}
  <circle cx="24" cy="24" r="16"/>
  <path d="M30 18l-8 6-4 8 8-6z"/>
  {% elif name == 'globe' %}
  <circle cx="24" cy="24" r="16"/>
  <path d="M8 24h32"/>
  <path d="M24 8c5 4 8 10 8 16s-3 12-8 16c-5-4-8-10-8-16s3-12 8-16z"/>
  {% elif name == 'grid' %}
  <rect x="8" y="8" width="12" height="12" rx="2"/>
  <rect x="28" y="8" width="12" height="12" rx="2"/>
  <rect x="8" y="28" width="12" height="12" rx="2"/>
  <rect x="28" y="28" width="12" height="12" rx="2"/>
  {% endif %}
</svg>
{% endmacro %}
